services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dentissa_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - dentissa_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: dentissa_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/dentissa.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dentissa_network
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: dentissa_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dentissa
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - dentissa_db_data:/var/lib/mysql
      - ./database/dentissa.sql:/docker-entrypoint-initdb.d/dentissa.sql
    networks:
      - dentissa_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dentissa_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    networks:
      - dentissa_network
    depends_on:
      - db

volumes:
  dentissa_db_data:
    driver: local
  vendor_data:
    driver: local

networks:
  dentissa_network:
    driver: bridge