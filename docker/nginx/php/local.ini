[PHP]
post_max_size = 100M
upload_max_filesize = 100M
max_execution_time = 300
memory_limit = 256M
date.timezone = America/Mexico_City
; Sin la versión de PHP en X-Powered-By (spec 031, CA4).
expose_php = Off
; Las trazas que deja report() no llevan los argumentos de las llamadas (spec 031, /review R6).
zend.exception_ignore_args = On

