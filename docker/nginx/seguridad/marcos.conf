# Spec 038 (D5; CA7, TM3): marcos que admite cada ruta.
#
# Solo la página de inicio (/, con o sin consulta) puede incrustar el mapa de
# Google; el resto de la app, solo marcos propios. Va en el contexto http
# (antes del server) y comunes.conf lo usa en frame-src. Se elige por la ruta
# original ($request_uri) porque Laravel atiende / por index.php y un
# "location = /" no llegaría a las cabeceras de la respuesta de PHP.
map $request_uri $dentissa_frame_src {
    default "'self'";
    "~^/(\?.*)?$" "'self' https://www.google.com";
}
