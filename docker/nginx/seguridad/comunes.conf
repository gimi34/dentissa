# Spec 031 (D1, D2; CA1, CA2): cabeceras de seguridad, en local y en producción.
#
# Se incluye en el server y en cada location con add_header propio: nginx no
# hereda las cabeceras de un nivel superior en cuanto un bloque declara una.
# "always" las añade también a las redirecciones y a los errores.
#
# La política de contenido admite el código incrustado actual de las vistas
# ('unsafe-inline'); la estricta queda en el roadmap (RS8.d). Solo carga fuentes
# externas de Google.
#
# Spec 038 (D5; CA7): frame-src sale del map de marcos.conf; solo / admite el
# mapa de Google. frame-ancestors y X-Frame-Options no cambian.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src $dentissa_frame_src; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
