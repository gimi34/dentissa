# Spec 031 (D3; CA3): las cabeceras comunes más la conexión segura obligatoria,
# solo en producción (en local no hay conexión segura). 180 días con
# subdominios; sin "preload", porque el dominio .app ya está en la lista de
# precarga de los navegadores.
include /etc/nginx/snippets/dentissa/comunes.conf;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
