# Spec 030: nginx de producción, detrás de cloudflared (D3, D18).
# Spec 038 (D5): marcos que admite cada ruta (map en el contexto http; lo usa
# frame-src en comunes.conf).
include /etc/nginx/snippets/dentissa/marcos.conf;

# Spec 041 (D7, TM6): el token de restablecimiento no llega al log de acceso, ni en la petición ni en
# el Referer. El formato es combined con esos dos campos enmascarados: el vigilante de la 032 lo lee
# igual. El error_log no se puede configurar: excepción acotada a P8 (plan 041, Riesgos).
map $request $dentissa_peticion_log {
    default $request;
    "~^(.*/contrasena/nueva/)[^/?\s]+(.*)$" "$1***$2";
}

map $http_referer $dentissa_referer_log {
    default $http_referer;
    "~^(.*/contrasena/nueva/)[^/?\s]+(.*)$" "$1***$2";
}

log_format dentissa_enmascarado '$remote_addr - $remote_user [$time_local] "$dentissa_peticion_log" $status $body_bytes_sent "$dentissa_referer_log" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    # Sin versión de nginx en las cabeceras ni en las páginas de error (spec 031, CA4).
    server_tokens off;
    # Spec 039 (ADR 0009, TM3): fotos de la galería de hasta 5 MB más el formulario; el resto
    # de rutas no admite cuerpos grandes por su validación.
    client_max_body_size 6m;

    # Spec 031 (D1–D3): cabeceras de seguridad y conexión segura obligatoria.
    include /etc/nginx/snippets/dentissa/produccion.conf;

    index index.php index.html;
    root /var/www/public;

    # IP real del cliente: cloudflared la envía en CF-Connecting-IP. Solo se
    # acepta desde la red de producción (subred fija del Compose); desde
    # cualquier otro origen se ignora, igual que un X-Forwarded-For (TM4).
    set_real_ip_from 172.28.0.0/24;
    real_ip_header CF-Connecting-IP;

    # Archivos propios (no los enlaces a stdout de la imagen) para que se
    # conserven en el volumen nginx_logs (OB7.a, CA9).
    access_log /var/log/nginx/dentissa-access.log dentissa_enmascarado;
    error_log  /var/log/nginx/dentissa-error.log;

    # Quien entra por http:// recibe 301 a https:// antes de llegar a la
    # aplicación; las peticiones internas (sin la cabecera) no se redirigen (TM9).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Archivos estáticos con caché
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Con un add_header propio, nginx no hereda las del server (spec 031, D1).
        include /etc/nginx/snippets/dentissa/produccion.conf;
    }
}
