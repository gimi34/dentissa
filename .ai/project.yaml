# Generado por /init. Lo leen todas las skills del flujo.
name: dentissa
type: fullstack                # frontend | backend | fullstack | mobile | monorepo | library
stage: mvp                     # prototype | mvp | production | maintenance
origin: brownfield             # greenfield | brownfield
language: es                   # es | en | … idioma de los documentos (shared/vocabulary.md)
initialized_at: 2026-09-28
stack:
  languages: [php, blade, javascript, sql]
  frontend: blade + css propio en public/css (vite + tailwind 4 declarados, casi sin uso)
  backend: laravel 12 (php ^8.2; imagen docker php 8.4-fpm) + laravel/socialite
  database: mariadb 10.11 (docker)
  package_manager: composer (+ npm para assets)
packages: []                   # solo monorepo: [{ path: apps/web, type: frontend }, …]
constitution_version: 1.2.1
workflow:
  enforcement: warn            # off | warn (pide aprobación) | block — lo aplica el hook del plugin
  legacy_workflow: aidlc-paused   # AI-DLC pausado el 2026-09-28 (decisión del usuario); ver AIDLC.md
skills_version: 1.11.5         # versión del paquete de skills (upgrade desde 1.11.2 el 2026-10-09)
deploy:
  strategy: manual             # none | manual | ci-on-merge | ci-on-tag
  platform: servidor propio (Ubuntu Server 24.04) con Docker Compose y Cloudflare Tunnel (ADR 0005, spec 030)
  environments: [dev, prod]   # staging pendiente (RD1.d, RD3.d)
  prod_approval: human         # innegociable
  rollback: deploy/volver.sh <tag anterior> [copia de la base] (docs/deployment.md, ensayado en la spec 030)
security:
  owasp_top10_edition: 2025
  asvs_level: 2
  masvs_level: null              # solo mobile (no aplica: fullstack)
  sensitive_data: [personal, health, credentials]
  tools:                       # status: propuesta | instalada | en-ci | no-aplica. Solo se ejecutan
                               # instalada y en-ci; no-aplica lleva su motivo en docs/security.md.
                               # en-ci: las cuatro corren en .github/workflows/ai-dd.yml y en local con
                               # sus imágenes Docker (decisión del usuario, 2026-10-02).
    secrets: { command: "gitleaks detect --no-banner", status: en-ci }
    sast: { command: "semgrep scan --config p/php --metrics=off --error", status: en-ci }
    sca: { command: "composer audit --locked --ignore-severity=low --ignore-severity=medium && npm audit --audit-level=high", status: en-ci }
    containers: { command: "trivy fs --severity HIGH,CRITICAL .", status: en-ci }
    dast: { command: null, status: no-aplica }   # solo contra staging, que no existe (docs/security.md)
  agent:
    min_package_age_days: 7
    protected_paths:           # además de las de shared/agent-security.md
      - AIDLC.md
      - aidlc/
      - docker-compose.yml
      - Dockerfile
      - database/dentissa.sql
observability:
  log_level_prod: info
  correlation_header: X-Request-Id
  audit:
    required: true
    events: [login, login_failed, logout, access_denied, sensitive_read, sensitive_write, role_change, account_change]
    retention: 5 años (decisión del usuario, 2026-09-28)
design:                        # solo proyectos con interfaz (frontend, fullstack, mobile)
  status: approved             # none | declined | draft | approved — re-extraído con AI-DD 1.11.2 y aprobado (decisión del usuario, 2026-10-04)
  source: extracted            # chosen | extracted | null
  system: docs/design/system.md
  html: docs/design/system.html
  canvas: null
  widths: [320, 390, 1440]     # 320 por WCAG 1.4.10 (spec 033, decisión del usuario, 2026-10-11)
skills:
  enabled: []                  # `design` (plugin oficial de Anthropic) no está instalado; quitado
                               # en el upgrade a 1.11.0 (decisión del usuario, 2026-10-02)
paths:
  constitution: docs/constitution.md
  architecture: docs/architecture.md
  roadmap: docs/roadmap.md
  deployment: docs/deployment.md
  security: docs/security.md
  observability: docs/observability.md
  changelog: CHANGELOG.md
